id: IND_POSTCODE_MEDIAN
name: Median & Average Taxable Income by Postcode — time series (2003-04 to 2023-24)
description: |
  ATO Taxation Statistics Table 8 — median and average taxable income for
  individuals by state/territory and postcode, for 8 selected income years
  (2003-04, 2013-14, then every year 2018-19 through 2023-24) drawn from the
  source table's full continuous run back to 2003-04. ~2,300 postcodes ×
  per-year (individual count, median, average). This is the "what's the
  median income in postcode X over time?" table — the cleanest answer to
  that exact question.
  Source: ATO Taxation Statistics, dataset on data.gov.au.
period_coverage: 2003-04 to 2023-24
update_frequency: annual
source_url: https://data.gov.au/data/dataset/taxation-statistics-2023-24
download_url: https://data.gov.au/data/dataset/faea4485-f407-457d-97f8-3f0822ccd654/resource/4db4ef74-bd3e-47d0-a56e-29659f812c8a/download/ts24individual08medianaveragetaxableincomestatepostcode.xlsx
discovery:
  organization_id: australiantaxationoffice
  package_id_pattern: '^taxation-statistics-(\d{4})-\d{2}$'
  resource_name: Individuals - Table 8
format: xlsx
sheet: Table 8
header_row: 2
layout: wide
cache_kind: data
search_keywords:
  - median income
  - average income
  - postcode income
  - postcode median taxable income
  - postcode trend
  - income time series
  - suburb income
  - property tech
  - household income
